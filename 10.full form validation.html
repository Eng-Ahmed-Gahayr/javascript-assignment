<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Validation </title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  form {
    max-width: 400px;
    margin: auto;
  }
  input {
    display: block;
    margin-bottom: 10px;
    padding: 8px;
    width: 100%;
  }
  .error {
    color: red;
    font-size: 0.9em;
  }
  .success {
    color: green;
    font-size: 1em;
  }
</style>
</head>
<body>

<h2>Registration Form</h2>

<form id="registrationForm">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Enter your name">
  <div class="error" id="nameError"></div>

  <label for="phone">Phone:</label>
  <input type="text" id="phone" name="phone" placeholder="Enter your phone number">
  <div class="error" id="phoneError"></div>

  <label for="email">Email:</label>
  <input type="text" id="email" name="email" placeholder="Enter your email">
  <div class="error" id="emailError"></div>

  <label for="password">Password:</label>
  <input type="password" id="password" name="password" placeholder="Enter password">
  <div class="error" id="passwordError"></div>

  <label for="retypePassword">Retype Password:</label>
  <input type="password" id="retypePassword" name="retypePassword" placeholder="Retype password">
  <div class="error" id="retypePasswordError"></div>

  <button type="submit">Submit</button>
  <div class="success" id="successMsg"></div>
</form>

<script>
document.getElementById('registrationForm').addEventListener('submit', function(e) {
    e.preventDefault(); 


    document.getElementById('nameError').textContent = '';
    document.getElementById('phoneError').textContent = '';
    document.getElementById('emailError').textContent = '';
    document.getElementById('passwordError').textContent = '';
    document.getElementById('retypePasswordError').textContent = '';
    document.getElementById('successMsg').textContent = '';


    let name = document.getElementById('name').value.trim();
    let phone = document.getElementById('phone').value.trim();
    let email = document.getElementById('email').value.trim();
    let password = document.getElementById('password').value;
    let retypePassword = document.getElementById('retypePassword').value;

    let isValid = true;

    if(name.length < 3) {
        document.getElementById('nameError').textContent = 'Name must be at least 3 characters.';
        isValid = false;
    }

   
    let phonePattern = /^[0-9]{7,}$/;
    if(!phonePattern.test(phone)) {
        document.getElementById('phoneError').textContent = 'Phone must be at least 7 digits.';
        isValid = false;
    }

    
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailPattern.test(email)) {
        document.getElementById('emailError').textContent = 'Please enter a valid email address.';
        isValid = false;
    }

  
    if(password.length < 6) {
        document.getElementById('passwordError').textContent = 'Password must be at least 6 characters.';
        isValid = false;
    }

  
    if(password !== retypePassword) {
        document.getElementById('retypePasswordError').textContent = 'Passwords do not match.';
        isValid = false;
    }

    
    if(isValid) {
        document.getElementById('successMsg').textContent = 'Form submitted successfully!';
    }
});
</script>

</body>
</html>
