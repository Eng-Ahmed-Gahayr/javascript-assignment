<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Beautiful Analog Clock</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f172a;
    font-family: Arial, sans-serif;
  }

  .clock {
    position: relative;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: #020617;
    border: 8px solid #38bdf8;
  }

  /* numbers */
  .number {
    position: absolute;
    color: #e5e7eb;
    font-size: 20px;
    font-weight: bold;
    transform: translate(-50%, -50%);
  }

  /* hands */
  .hand {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: left center;
    border-radius: 4px;
  }

  .hour {
    width: 70px;
    height: 7px;
    background: #f97316;
  }

  .minute {
    width: 100px;
    height: 5px;
    background: #38bdf8;
  }

  .second {
    width: 120px;
    height: 2px;
    background: #ef4444;
  }

  .center {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #e5e7eb;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>

<div class="clock">
  
  <div class="number" style="top: 30px; left: 160px;">12</div>
  <div class="number" style="top: 160px; left: 300px;">3</div>
  <div class="number" style="top: 300px; left: 160px;">6</div>
  <div class="number" style="top: 160px; left: 20px;">9</div>
  


  <div class="hand hour" id="hour"></div>
  <div class="hand minute" id="minute"></div>
  <div class="hand second" id="second"></div>

  <div class="center"></div>
</div>

<script>
  const hourHand = document.getElementById("hour");
  const minuteHand = document.getElementById("minute");
  const secondHand = document.getElementById("second");

  function updateClock() {
    const now = new Date();
    const sec = now.getSeconds();
    const min = now.getMinutes();
    const hr = now.getHours();

    const secDeg = sec * 6;
    const minDeg = min * 6 + sec * 0.1;
    const hrDeg = (hr % 12) * 30 + min * 0.5;

    secondHand.style.transform = `rotate(${secDeg}deg)`;
    minuteHand.style.transform = `rotate(${minDeg}deg)`;
    hourHand.style.transform = `rotate(${hrDeg}deg)`;
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>

</body>
</html>
