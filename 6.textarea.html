<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <title>Textarea Download</title>
    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:20px;
        }
        textarea{
            width:100%;
            height:200px;
            font-size:16px;
            padding:10px;
        }
        button{
            margin-top:10px;
            padding:10px 20px;
            font-size:16px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<h2>Texxtarea</h2>

<textarea id="myText" placeholder="textarea..."></textarea>

<br>
<button onclick="downloadText()">Download File</button>

<script>
function downloadText(){
    let text = document.getElementById("myText").value;

    if(text === ""){
        alert("write your text ");
        return;
    }

    let blob = new Blob([text], { type: "text/plain" });
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "Textarea.txt";
    a.click();

    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
