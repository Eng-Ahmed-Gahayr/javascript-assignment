<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Beautiful Calculator</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(to right, #6a11cb, #2575fc);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .calculator {
        background-color: #fff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        padding: 20px;
        width: 320px;
    }

    .display {
        width: 100%;
        height: 60px;
        font-size: 28px;
        text-align: right;
        padding: 10px;
        border-radius: 15px;
        border: none;
        margin-bottom: 15px;
        box-shadow: inset 0 3px 5px rgba(0,0,0,0.1);
        background-color: #f7f7f7;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
    }

    .buttons button {
        height: 60px;
        font-size: 22px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 5px #ccc;
    }

    .buttons button:active {
        transform: translateY(2px);
        box-shadow: 0 3px #bbb;
    }

    .number { background-color: #f0f0f0; }
    .operator { background-color: #ff9f1c; color: white; }
    .operator:hover { background-color: #ff7f50; }
    .clear { background-color: #ff4b5c; color: white; }
    .clear:hover { background-color: #e63946; }
    .equal { background-color: #2a9d8f; color: white; grid-column: span 2; }
    .equal:hover { background-color: #21867a; }
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" class="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        <button class="operator" onclick="appendValue('-')">-</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number" onclick="appendValue('7')">7</button>
        <button class="number" onclick="appendValue('8')">8</button>
        <button class="number" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('')">x^y</button>

        <button class="number" onclick="appendValue('4')">4</button>
        <button class="number" onclick="appendValue('5')">5</button>
        <button class="number" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="squareRoot()">√</button>
        <button class="number" onclick="appendValue('1')">1</button>

        <button class="number" onclick="appendValue('2')">2</button>
        <button class="number" onclick="appendValue('3')">3</button>
        <button class="number" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button class="number" onclick="appendValue('.')">.</button>

        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let display = document.getElementById('display');

    function appendValue(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = '';
    }

    function squareRoot() {
        if(display.value !== ''){
            display.value = Math.sqrt(eval(display.value));
        }
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
